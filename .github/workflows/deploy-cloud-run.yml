name: Deploy backend to Cloud Run

on:
  push:
    branches:
      - feature/phase_data_migration

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: reckon-dental
  REGION: us-central1
  REPO: dentc
  SERVICE: dentc-backend
  # Cloud SQL instance that hosts recondental_migrated (note: DB region is us-east1,
  # distinct from the Cloud Run REGION above). Used by the migration step's proxy.
  INSTANCE_CONNECTION_NAME: reckon-dental:us-east1:recon-dental-db

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Debug GitHub Context
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Repository Owner: ${{ github.repository_owner }}"
          echo "Ref: ${{ github.ref }}"
          echo "Actor: ${{ github.actor }}"
          echo "WIF_PROVIDER set: ${{ secrets.WIF_PROVIDER != '' }}"
          echo "WIF_SERVICE_ACCOUNT set: ${{ secrets.WIF_SERVICE_ACCOUNT != '' }}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      - name: Build & Push Image
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPO/$SERVICE:${{ github.sha }}"
          echo "Building $IMAGE"

          docker build -t "$IMAGE" .
          docker push "$IMAGE"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # Apply pending Alembic migrations to the prod DB BEFORE rolling out the new
      # image, so the new revision never runs against an old schema. `upgrade head`
      # is idempotent — a no-op once prod is current. A failure here fails the job
      # and blocks the deploy (intentional). Runs alembic inside the freshly built
      # image (it already has the deps + alembic/ config) against the Cloud SQL Auth
      # Proxy's unix socket. Requires the CI service account to have roles/cloudsql.client
      # and secretmanager.secretAccessor on the DATABASE_URL secret.
      - name: Run DB migrations (alembic upgrade head)
        run: |
          set -euo pipefail
          curl -sSL -o cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          sudo mkdir -p /cloudsql && sudo chmod 777 /cloudsql

          ./cloud-sql-proxy --unix-socket /cloudsql "$INSTANCE_CONNECTION_NAME" &
          PROXY_PID=$!
          trap 'kill "$PROXY_PID" 2>/dev/null || true' EXIT

          # Wait for the proxy's unix socket to appear (psycopg2 expects .s.PGSQL.5432).
          for i in $(seq 1 30); do
            [ -S "/cloudsql/$INSTANCE_CONNECTION_NAME/.s.PGSQL.5432" ] && break
            sleep 1
          done

          # DATABASE_URL is the unix-socket form (host=/cloudsql/<INSTANCE>) held in
          # Secret Manager; mount the host socket dir into the container so it resolves.
          DB_URL="$(gcloud secrets versions access latest --secret=DATABASE_URL)"
          docker run --rm --network host -v /cloudsql:/cloudsql \
            -e DATABASE_URL="$DB_URL" "$IMAGE" \
            python -c "from alembic.config import main; main(['upgrade','head'])"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE \
            --image "$IMAGE" \
            --region "$REGION" \
            --project "$PROJECT_ID"