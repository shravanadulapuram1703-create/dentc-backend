name: Deploy backend to Cloud Run

on:
  push:
    branches:
      - feature/phase_data_migration

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: reckon-dental
  REGION: us-central1
  REPO: dentc
  SERVICE: dentc-backend
  # Cloud SQL instance that hosts recondental_migrated (note: DB region is us-east1,
  # distinct from the Cloud Run REGION above). Used by the migration step's proxy.
  INSTANCE_CONNECTION_NAME: reckon-dental:us-east1:recon-dental-db
  # Memorystore (Redis) reached over Direct VPC egress. The host is a PRIVATE IP,
  # so Cloud Run must attach to the VPC (see the deploy step's --network/--subnet/
  # --vpc-egress flags) to route to it. The messaging fan-out + presence + token
  # store all use this; without it the WS gateway degrades to per-instance delivery.
  # Change these here if Memorystore is re-created with a different IP/port. Not a
  # secret (basic-tier Memorystore has no AUTH), so plain env is fine.
  REDIS_HOST: 10.48.189.19
  REDIS_PORT: "6379"
  # VPC for Direct egress. `default`/`default` matches the console setup; the subnet
  # MUST live in the Cloud Run REGION (us-central1) and share the VPC with Redis.
  VPC_NETWORK: default
  VPC_SUBNET: default

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Debug GitHub Context
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Repository Owner: ${{ github.repository_owner }}"
          echo "Ref: ${{ github.ref }}"
          echo "Actor: ${{ github.actor }}"
          echo "WIF_PROVIDER set: ${{ secrets.WIF_PROVIDER != '' }}"
          echo "WIF_SERVICE_ACCOUNT set: ${{ secrets.WIF_SERVICE_ACCOUNT != '' }}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      - name: Build & Push Image
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPO/$SERVICE:${{ github.sha }}"
          echo "Building $IMAGE"

          docker build -t "$IMAGE" .
          docker push "$IMAGE"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # Apply pending Alembic migrations to the prod DB BEFORE rolling out the new
      # image, so the new revision never runs against an old schema. `upgrade head`
      # is idempotent — a no-op once prod is current. A failure here fails the job
      # and blocks the deploy (intentional). Runs alembic inside the freshly built
      # image (it already has the deps + alembic/ config) against the Cloud SQL Auth
      # Proxy's unix socket. Requires the CI service account to have roles/cloudsql.client
      # and secretmanager.secretAccessor on the DATABASE_URL secret.
      - name: Run DB migrations (alembic upgrade head)
        run: |
          set -euo pipefail
          curl -sSL -o cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          sudo mkdir -p /cloudsql && sudo chmod 777 /cloudsql

          ./cloud-sql-proxy --unix-socket /cloudsql "$INSTANCE_CONNECTION_NAME" &
          PROXY_PID=$!
          trap 'kill "$PROXY_PID" 2>/dev/null || true' EXIT

          # Wait for the proxy's unix socket to appear (psycopg2 expects .s.PGSQL.5432).
          for i in $(seq 1 30); do
            [ -S "/cloudsql/$INSTANCE_CONNECTION_NAME/.s.PGSQL.5432" ] && break
            sleep 1
          done

          # DATABASE_URL is the unix-socket form (host=/cloudsql/<INSTANCE>) held in
          # Secret Manager; mount the host socket dir into the container so it resolves.
          DB_URL="$(gcloud secrets versions access latest --secret=DATABASE_URL)"
          docker run --rm --network host -v /cloudsql:/cloudsql \
            -e DATABASE_URL="$DB_URL" "$IMAGE" \
            python -c "from alembic.config import main; main(['upgrade','head'])"

      - name: Deploy to Cloud Run
        run: |
          # --update-env-vars (NOT --set-env-vars): this deploy does not declare
          # DATABASE_URL / JWT_SECRET / etc. — those live on the service (console /
          # Secret Manager). --set-env-vars REPLACES the whole set and would wipe
          # them, breaking the service. --update-env-vars merges, touching only the
          # Redis keys.
          #
          # --network/--subnet/--vpc-egress enable Direct VPC egress so the service
          # can reach Memorystore's private IP. private-ranges-only keeps internet
          # traffic (Gemini, Stripe, …) on the normal path — only RFC-1918 ranges
          # go through the VPC, so no Cloud NAT is required.
          gcloud run deploy $SERVICE \
            --image "$IMAGE" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --network "$VPC_NETWORK" \
            --subnet "$VPC_SUBNET" \
            --vpc-egress private-ranges-only \
            --update-env-vars "REDIS_ENABLED=true,REDIS_HOST=$REDIS_HOST,REDIS_PORT=$REDIS_PORT"

          # Force 100% traffic onto the revision we just built. Without this, a
          # service whose traffic was ever pinned to a specific revision (e.g. a
          # past console rollback) keeps serving the OLD revision — `gcloud run
          # deploy` creates the new one but does NOT migrate traffic to it. That
          # produces a green deploy serving stale code (symptom: new routes 404).
          # --to-latest is idempotent when traffic already tracks latest.
          gcloud run services update-traffic $SERVICE \
            --region "$REGION" --project "$PROJECT_ID" --to-latest

          echo "Now serving:"
          gcloud run services describe $SERVICE --region "$REGION" --project "$PROJECT_ID" \
            --format='value(status.traffic)'

      # Post-deploy gate: confirm the running revision can actually reach Redis over
      # the VPC. A green deploy with a mis-wired VPC/IP would otherwise look fine
      # while real-time messaging silently degrades. Fails the job if it can't.
      #
      # A 404 here means stale code is serving (the /health/redis route is missing),
      # NOT a Redis problem — distinct from a 200 with "connected": false, which is
      # a real VPC/Redis failure. The messages below keep the two apart.
      - name: Verify Redis connectivity
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe $SERVICE --region "$REGION" \
            --project "$PROJECT_ID" --format='value(status.url)')"
          echo "Probing $URL/health/redis"
          for i in $(seq 1 10); do
            code="$(curl -s -o /tmp/body -w '%{http_code}' "$URL/health/redis" || true)"
            body="$(cat /tmp/body 2>/dev/null || true)"
            echo "HTTP $code $body"
            if echo "$body" | grep -q '"connected": *true'; then
              echo "✅ Redis reachable from Cloud Run."
              exit 0
            fi
            if [ "$code" = "404" ]; then
              echo "⚠️  /health/redis 404 — a STALE revision is serving (not a Redis issue)."
            fi
            sleep 6
          done
          if [ "$code" = "404" ]; then
            echo "❌ Serving revision lacks /health/redis — traffic did not move to the new revision."
          else
            echo "❌ New revision is live but cannot reach Redis. Check VPC egress + REDIS_HOST ($REDIS_HOST)."
          fi
          exit 1